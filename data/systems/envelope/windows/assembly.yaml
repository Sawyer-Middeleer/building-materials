defaults:
  basis: specification
  evidence:
    - source: source.institutions.ua.window-guidelines
      locator: { page: 13, section: I. Glazing }

entities:
  - id: envelope.openings.window
    kind: referenceDesign
    label: Double-glazed architectural window assembly
    revision: "1"
    identifiers:
      - namespace: uniformat2
        value: B2020
      - namespace: masterformat
        value: "08 50 00"
      - namespace: ifc
        value: IfcWindow
    expectedProfile:
      properties:
        - uFactor
        - solarHeatGainCoefficient
        - visibleLightTransmittance
        - airInfiltration
        - structuralDesignPressure
        - installedCostPerArea
        - serviceLife
      parameters:
        - operationType
        - nominalWidth
        - nominalHeight
        - jambDepth
        - finishColor
      interfaces:
        - rough-opening
        - drainage-plane
        - interior-finish-return
      materialRoles:
        - frame
        - sash
        - glazing
        - spacer
        - weatherstripping
        - hardware
    links:
      - predicate: hasPart
        target: envelope.openings.window.frame
        locator: { page: 9, section: "Section 08 50 00 – Windows" }
        qualifiers: { role: frame, sequence: 1 }
      - predicate: hasPart
        target: envelope.openings.window.sash
        locator: { page: 9, section: "Section 08 50 00 – Windows" }
        qualifiers: { role: sash, sequence: 2 }
      - predicate: hasPart
        target: envelope.openings.window.igu
        qualifiers: { role: glazing, sequence: 3 }
      - predicate: hasPart
        target: envelope.openings.window.weatherstripping
        locator: { page: 21, section: "Section 08 50 00 – Windows" }
        qualifiers: { role: air-water-seal, sequence: 4 }
      - predicate: hasPart
        target: envelope.openings.window.hardware
        locator: { page: 11, section: "Section 08 50 00 – Windows" }
        qualifiers: { role: operator-and-lock, sequence: 5 }
    guide:
      summary: Complete fenestration assembly combining perimeter frame, operable sash, factory-sealed insulating glass unit, weatherstripping, and operating hardware.

  - id: envelope.openings.window.frame
    kind: referenceDesign
    label: Window perimeter frame
    guide:
      summary: Structural outer perimeter frame anchored into the rough opening; material varies by product archetype (aluminum, composite, vinyl, wood-clad).

  - id: envelope.openings.window.sash
    kind: referenceDesign
    label: Operable window sash
    guide:
      summary: Movable or fixed glazing-holding subframe inside the perimeter frame; material varies by product archetype.

  - id: envelope.openings.window.weatherstripping
    kind: referenceDesign
    label: Perimeter sash weatherstripping
    guide:
      summary: Flexible compression or fin-seal gasket around the sash perimeter controlling drafts and water penetration; material varies by product line (EPDM, TPE, silicone, woven pile).

  - id: envelope.openings.window.hardware
    kind: referenceDesign
    label: Operating hardware, balances & locks
    guide:
      summary: Sash balances, hinges, crank operators, and cam/multi-point locks governing operability and air-seal compression; material varies by product line (stainless steel, zinc alloy, nylon).

  - id: envelope.openings.window.igu
    kind: referenceDesign
    label: 1-inch insulating glass unit (IGU)
    links:
      - predicate: hasPart
        target: envelope.openings.window.outer-pane
        basis: manufacturer-declared
        evidence:
          - source: source.manufacturers.vitro.solarban-70
            locator: { page: 2, table: Insulating Glass Unit Performance Comparisons }
        qualifiers: { role: pane, position: outside, sequence: 1 }
      - predicate: hasPart
        target: envelope.openings.window.inner-pane
        basis: manufacturer-declared
        evidence:
          - source: source.manufacturers.vitro.solarban-70
            locator: { page: 2, table: Insulating Glass Unit Performance Comparisons }
        qualifiers: { role: pane, position: inside, sequence: 2 }
      - predicate: hasPart
        target: envelope.openings.window.spacer
        qualifiers: { role: spacer, position: edge, sequence: 3 }
      - predicate: hasPart
        target: envelope.openings.window.seal
        qualifiers: { role: seal, position: edge, sequence: 4 }

  - id: envelope.openings.window.outer-pane
    kind: referenceDesign
    label: Coated outer glass pane (1/4-inch)
    links:
      - predicate: madeOf
        target: material.soda-lime-glass
        basis: typical-reference
        evidence:
          - source: source.research.mdpi.flat-glass-structure
            locator: { page: 5, section: "3.1. Composition and Network Structure" }
        qualifiers: { role: substrate }
      - predicate: madeOf
        target: material.low-e-coating
        basis: manufacturer-declared
        evidence:
          - source: source.manufacturers.vitro.solarban-70
            locator: { page: 1, section: Solarban 70 Glass }
        qualifiers: { role: coating, position: "surface #2" }

  - id: envelope.openings.window.inner-pane
    kind: referenceDesign
    label: Clear inner glass pane (1/4-inch)
    links:
      - predicate: madeOf
        target: material.soda-lime-glass
        basis: typical-reference
        evidence:
          - source: source.research.mdpi.flat-glass-structure
            locator: { page: 5, section: "3.1. Composition and Network Structure" }
        qualifiers: { role: substrate }

  - id: envelope.openings.window.spacer
    kind: referenceDesign
    label: IGU perimeter spacer bar
    guide:
      summary: Continuous perimeter spacer separating IGU glass lites and housing desiccant; material varies by system (aluminum, stainless steel, or warm-edge polymer).

  - id: envelope.openings.window.seal
    kind: referenceDesign
    label: IGU dual perimeter seal
    links:
      - predicate: madeOf
        target: material.polyisobutylene
        locator: { row: "9. Dual perimeter sealants" }
        qualifiers: { role: primary seal }
      - predicate: madeOf
        target: material.silicone-sealant
        locator: { row: "9. Dual perimeter sealants" }
        qualifiers: { role: secondary seal }
