<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Materials</title>
<style>
  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --subtle: #f2f0ea;
    --border: #e6e3da;
    --border-strong: #d0ccc0;
    --ink: #181816;
    --muted: #646159;
    --faint: #928e84;
    --accent: #1d4ed8;
    --accent-bg: #eff6ff;
    --teal: #0f766e;
    --teal-bg: #f0fdfa;
    --amber: #b45309;
    --amber-bg: #fffbeb;
    --rose: #be123c;
    --rose-bg: #fff1f2;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.5; }
  button, input, select { font: inherit; color: inherit; }

  .app { display: grid; grid-template-rows: 50px 1fr; height: 100vh; overflow: hidden; }

  /* Top Navigation */
  .topbar {
    display: flex; align-items: center; gap: 20px; padding: 0 20px;
    background: var(--surface); border-bottom: 1px solid var(--border); z-index: 20;
  }
  .brand { font-weight: 650; font-size: 14px; letter-spacing: -0.01em; white-space: nowrap; }
  .nav { display: flex; gap: 4px; }
  .nav-btn {
    border: none; background: transparent; padding: 6px 12px; border-radius: 6px;
    font-size: 13px; font-weight: 500; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .nav-btn:hover { background: var(--subtle); color: var(--ink); }
  .nav-btn.active { background: var(--ink); color: #fff; }
  .nav-count {
    font-family: var(--mono); font-size: 10.5px; padding: 0 6px; border-radius: 999px;
    background: var(--amber-bg); color: var(--amber); font-weight: 600;
  }
  .nav-btn.active .nav-count { background: rgba(255,255,255,0.2); color: #fff; }

  /* Quick Jump Search */
  .jump-wrap { margin-left: auto; position: relative; width: 250px; }
  .jump-wrap input {
    width: 100%; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); font-size: 12.5px; outline: none;
  }
  .jump-wrap input:focus { border-color: var(--ink); background: var(--surface); }
  .jump-menu {
    position: absolute; top: calc(100% + 4px); left: 0; right: 0; max-height: 320px; overflow-y: auto;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.08); display: none; z-index: 30; padding: 4px;
  }
  .jump-menu.open { display: block; }
  .jump-item {
    display: flex; flex-direction: column; width: 100%; text-align: left; border: none;
    background: transparent; padding: 6px 8px; border-radius: 5px; cursor: pointer;
  }
  .jump-item:hover { background: var(--subtle); }
  .jump-item-label { font-size: 12.5px; font-weight: 500; }
  .jump-item-sub { font-family: var(--mono); font-size: 10.5px; color: var(--faint); }

  /* Main 2-Pane Layout */
  .main { display: grid; grid-template-columns: 1fr 350px; min-height: 0; }
  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  /* Sub-toolbar (quiet single line) */
  .subbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 8px 18px; border-bottom: 1px solid var(--border); background: var(--bg);
    min-height: 44px; flex-shrink: 0;
  }
  .subbar-group { display: flex; align-items: center; gap: 8px; }
  .select-clean {
    padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface); font-size: 12.5px; cursor: pointer;
  }
  .seg { display: inline-flex; background: var(--subtle); padding: 2px; border-radius: 6px; border: 1px solid var(--border); }
  .seg-btn {
    border: none; background: transparent; padding: 3px 9px; border-radius: 4px;
    font-size: 12px; color: var(--muted); cursor: pointer; white-space: nowrap; font-weight: 500;
  }
  .seg-btn.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
  .btn-sm {
    border: 1px solid var(--border); background: var(--surface); border-radius: 5px;
    padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--muted); white-space: nowrap;
  }
  .btn-sm:hover { border-color: var(--border-strong); color: var(--ink); }
  .meta-txt { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }

  /* Graph Canvas */
  .svg-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; background: var(--bg); }
  .svg-wrap:active { cursor: grabbing; }
  svg#graph { width: 100%; height: 100%; display: block; }
  .hint {
    position: absolute; left: 16px; bottom: 12px; font-size: 11px; color: var(--faint);
    pointer-events: none;
  }
  .edge-path { fill: none; stroke: #94a3b8; stroke-width: 1.5; transition: stroke 0.12s; cursor: pointer; }
  .edge-path:hover, .edge-path.selected { stroke: var(--accent); stroke-width: 2.4; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-label-bg { fill: var(--bg); opacity: 0.92; rx: 3; }
  .edge-label { font-family: var(--mono); font-size: 9.5px; fill: var(--muted); pointer-events: none; text-anchor: middle; }
  .edge-label.selected { fill: var(--accent); font-weight: 600; }
  .edge-group.dim-label .edge-label-bg, .edge-group.dim-label .edge-label { opacity: 0; transition: opacity 0.12s; }
  .edge-group.dim-label:hover .edge-label-bg, .edge-group.dim-label:hover .edge-label { opacity: 0.96; }

  .g-node { cursor: pointer; }
  .g-node rect { rx: 8; ry: 8; stroke-width: 1.3; transition: filter 0.12s; }
  .g-node:hover rect { filter: drop-shadow(0 2px 6px rgba(0,0,0,0.07)); }
  .g-node.selected rect { stroke-width: 2.2; stroke: var(--accent) !important; }
  .g-node-kind { font-family: var(--mono); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .g-node-title { font-size: 11.5px; font-weight: 600; fill: var(--ink); }
  .g-node-sub { font-family: var(--mono); font-size: 9.5px; fill: var(--faint); }

  /* Content Scroll Area (Compare, Tables, Gaps) */
  .scroll-view { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .container { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

  /* Cards & Tables */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .panel-head {
    padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex;
    align-items: center; justify-content: space-between; gap: 10px;
  }
  .panel-title { font-size: 11.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; }
  .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .data-table th {
    text-align: left; padding: 8px 12px; font-size: 11px; font-weight: 650; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--faint); border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 1;
  }
  .data-table td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .data-table tbody tr { cursor: pointer; }
  .data-table tbody tr:hover td { background: var(--bg); }
  .data-table tbody tr.row-selected td { background: var(--accent-bg); }
  .data-table tr.diff-row td { background: var(--amber-bg); }
  .mono { font-family: var(--mono); font-size: 11.5px; }

  .code-block {
    margin: 0; padding: 16px 18px; font-family: var(--mono); font-size: 12px; line-height: 1.55;
    overflow-x: auto; background: #faf9f6; color: var(--ink);
  }

  /* Compare */
  .pickers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: center; }
  .diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 14px; }
  .diff-col-title { font-size: 11px; font-weight: 650; color: var(--muted); margin-bottom: 8px; }
  .diff-item {
    display: block; width: 100%; text-align: left; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); margin-bottom: 6px; cursor: pointer;
  }
  .diff-item:hover { border-color: var(--accent); background: var(--accent-bg); }

  /* Gaps */
  .stat-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .stat-card {
    text-align: left; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer;
  }
  .stat-card:hover { border-color: var(--border-strong); }
  .stat-card.active { border-color: var(--ink); background: var(--ink); color: #fff; }
  .stat-num { font-family: var(--mono); font-size: 20px; font-weight: 700; line-height: 1.2; }
  .stat-lbl { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .stat-card.active .stat-lbl { color: rgba(255,255,255,0.75); }

  /* Badges */
  .tag {
    display: inline-flex; align-items: center; padding: 1px 7px; border-radius: 999px;
    font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--border); background: var(--bg); color: var(--muted);
    white-space: nowrap;
  }
  .tag-teal { background: var(--teal-bg); border-color: #99f6e4; color: var(--teal); }
  .tag-amber { background: var(--amber-bg); border-color: #fde68a; color: var(--amber); }
  .tag-rose { background: var(--rose-bg); border-color: #fecdd3; color: var(--rose); }

  /* Right Inspector (clean & quiet) */
  .inspector {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 18px 18px 28px; display: flex; flex-direction: column; gap: 18px;
  }
  .insp-head { display: flex; flex-direction: column; gap: 5px; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
  .insp-title { margin: 2px 0 0; font-size: 16px; font-weight: 650; line-height: 1.25; }
  .insp-actions { display: flex; gap: 6px; margin-top: 6px; }
  .insp-section-title {
    font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--faint); margin: 0 0 8px; display: flex; justify-content: space-between;
  }
  .fact-row {
    padding: 8px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 3px;
  }
  .fact-row:last-child { border-bottom: none; }
  .fact-line { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .fact-val { font-family: var(--mono); font-weight: 700; color: var(--teal); }
  .fact-val.unknown { color: var(--amber); font-style: italic; font-weight: 600; }

  .link-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
  }
  .link-row:last-child { border-bottom: none; }
  .link-main { min-width: 0; }
  .link-btn {
    border: none; background: none; padding: 0; color: var(--accent); font-weight: 500;
    cursor: pointer; text-align: left; font-size: 12.5px;
  }
  .link-btn:hover { text-decoration: underline; }
  .cite-link {
    border: none; background: none; padding: 0; font-family: var(--mono); font-size: 10.5px;
    color: var(--faint); cursor: pointer; flex-shrink: 0;
  }
  .cite-link:hover { color: var(--ink); text-decoration: underline; }

  .cite-card {
    background: #f8fbff; border: 1px solid #bfdbfe; border-radius: 8px; padding: 12px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cite-kv { display: grid; grid-template-columns: 72px 1fr; gap: 2px 8px; font-size: 11.5px; }
  .open-btn {
    display: inline-block; text-align: center; padding: 6px 10px; border-radius: 6px;
    background: var(--ink); color: #fff; text-decoration: none; font-size: 12px; font-weight: 500; margin-top: 2px;
  }
  .empty { color: var(--faint); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Building Materials</div>
    <nav class="nav" id="mainNav">
      <button class="nav-btn active" data-tab="graph">Graph</button>
      <button class="nav-btn" data-tab="compare">Compare</button>
      <button class="nav-btn" data-tab="tables">Tables</button>
      <button class="nav-btn" data-tab="gaps">Gaps <span class="nav-count" id="gapsBadge">–</span></button>
    </nav>
    <div class="jump-wrap">
      <input id="jumpInput" type="search" placeholder="Jump to node..." autocomplete="off">
      <div class="jump-menu" id="jumpMenu"></div>
    </div>
  </header>

  <main class="main">
    <section class="stage" id="stage"></section>
    <aside class="inspector" id="inspector">
      <div class="empty">Select any node or statement to inspect details and citations.</div>
    </aside>
  </main>
</div>

<script>
const KIND_STYLE = {
  referenceDesign: { color: "#1d4ed8", fill: "#eff6ff", border: "#bfdbfe", label: "Design" },
  productModel:    { color: "#4f46e5", fill: "#eef2ff", border: "#c7d2fe", label: "Model" },
  productVariant:  { color: "#6d28d9", fill: "#f5f3ff", border: "#ddd6fe", label: "Variant" },
  material:        { color: "#0f766e", fill: "#f0fdfa", border: "#99f6e4", label: "Material" },
  structureModel:  { color: "#047857", fill: "#ecfdf5", border: "#a7f3d0", label: "Structure" },
  chemicalEntity:  { color: "#0e7490", fill: "#ecfeff", border: "#a5f3fc", label: "Chemical" },
  process:         { color: "#c2410c", fill: "#fff7ed", border: "#fed7aa", label: "Process" },
  requirement:     { color: "#be123c", fill: "#fff1f2", border: "#fecdd3", label: "Requirement" },
  actor:           { color: "#7e22ce", fill: "#faf5ff", border: "#e9d5ff", label: "Actor" },
  source:          { color: "#57534e", fill: "#f5f5f4", border: "#d6d3d1", label: "Source" },
};

const STAGE_COL = {
  extraction: 0, research: 0,
  design: 1, specification: 1,
  fabrication: 2, testing: 3,
  distribution: 4, installation: 4,
};

const PRESETS = [
  { key: "parts:window-assembly", label: "Window → Atoms" },
  { key: "trace:igu-gray-argon", label: "IGU Value Chain" },
  { key: "used-by:vitro-solarban-70", label: "Where Solarban 70 is used" },
  { key: "full:", label: "Full Graph" },
];

const state = {
  tab: "graph",
  full: { nodes: [], statements: [], byId: new Map(), out: new Map(), inc: new Map() },
  graph: { mode: "parts", root: "window-assembly", nodes: [], statements: [], showSources: false },
  compare: { left: "winco-4410s-single-hung", right: "andersen-100-single-hung", data: null },
  tables: { sub: "nodes", filter: "", kind: "", sql: "" },
  gaps: { data: null, category: "all" },
  selectedNodeId: "window-assembly",
  selectedStatementId: null,
  citation: null,
  positions: new Map(),
  transform: { x: 40, y: 40, k: 1 },
};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const trunc = (s, n = 25) => (s.length > n ? s.slice(0, n - 1) + "…" : s);

async function api(path) {
  const res = await fetch(path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function fmtQty(q) {
  if (!q) return "";
  const unit = q.unit === "1" ? "" : ` ${q.unit}`;
  const val = q.value !== undefined ? `${q.value}` : `${q.min}–${q.max}`;
  return `${val}${unit}${q.basis ? ` (${q.basis})` : ""}`;
}

function fmtFact(f) {
  if (!f) return "—";
  if (f.quantity) return fmtQty(f.quantity);
  if (f.state) return f.state;
  return String(f.value);
}

function fmtQual(q) {
  if (!q) return "";
  return [q.role, q.position, q.sequence !== undefined ? `#${q.sequence}` : ""].filter(Boolean).join(" · ");
}

/* ---------- Boot & Data ---------- */

async function loadInitial() {
  const [graphData, gapsData, schemaData] = await Promise.all([
    api("/api/graph"),
    api("/api/gaps"),
    api("/api/schema"),
  ]);
  state.full.nodes = graphData.nodes;
  state.full.statements = graphData.statements;
  state.full.byId = new Map(graphData.nodes.map((n) => [n.id, n]));
  state.full.out = new Map(graphData.nodes.map((n) => [n.id, []]));
  state.full.inc = new Map(graphData.nodes.map((n) => [n.id, []]));
  for (const st of graphData.statements) {
    state.full.out.get(st.subject)?.push(st);
    if (st.target) state.full.inc.get(st.target)?.push(st);
  }
  state.gaps.data = gapsData;
  state.tables.sql = schemaData.sql;
  $("gapsBadge").textContent = gapsData.summary.total;
  await loadGraphSub("parts", "window-assembly");
}

async function loadGraphSub(mode, rootId) {
  state.graph.mode = mode;
  if (mode === "full") {
    state.graph.root = null;
    state.graph.nodes = state.full.nodes;
    state.graph.statements = state.full.statements;
  } else {
    const target = rootId || state.selectedNodeId || "window-assembly";
    const data = await api(`/api/${mode}/${encodeURIComponent(target)}`);
    state.graph.root = data.root;
    state.graph.nodes = data.nodes;
    state.graph.statements = data.statements;
    state.selectedNodeId = target;
  }
  state.tab = "graph";
  renderAll();
}

async function loadCompare(leftId, rightId) {
  state.compare.left = leftId || state.compare.left;
  state.compare.right = rightId || state.compare.right;
  state.compare.data = await api(`/api/compare/${encodeURIComponent(state.compare.left)}/${encodeURIComponent(state.compare.right)}`);
  state.tab = "compare";
  state.selectedNodeId = state.compare.left;
  renderAll();
}

function setTab(tab) {
  state.tab = tab;
  if (tab === "compare" && !state.compare.data) {
    loadCompare(state.compare.left, state.compare.right);
    return;
  }
  renderAll();
}

function selectNode(nodeId) {
  state.selectedNodeId = nodeId;
  state.selectedStatementId = null;
  state.citation = null;
  renderInspector();
  if (state.tab === "graph") renderSvg();
}

async function inspectStatement(st) {
  state.selectedStatementId = st.id;
  if (st.subject) state.selectedNodeId = st.subject;
  state.citation = null;
  renderInspector();
  if (state.tab === "graph") renderSvg();
  try {
    state.citation = await api(`/api/cite/${encodeURIComponent(st.id)}`);
  } catch (err) {
    state.citation = { error: err.message };
  }
  renderInspector();
}

function renderAll() {
  document.querySelectorAll(".nav-btn").forEach((b) => b.classList.toggle("active", b.dataset.tab === state.tab));
  if (state.tab === "graph") renderGraphTab();
  else if (state.tab === "compare") renderCompareTab();
  else if (state.tab === "tables") renderTablesTab();
  else if (state.tab === "gaps") renderGapsTab();
  renderInspector();
}

/* ---------- Tab 1: Graph ---------- */

function visibleSubgraph() {
  const nodes = state.graph.nodes.filter((n) => state.graph.showSources || n.kind !== "source");
  const ids = new Set(nodes.map((n) => n.id));
  const edges = state.graph.statements.filter((s) => s.predicate && ids.has(s.subject) && ids.has(s.target));
  return { nodes, edges };
}

function renderGraphTab() {
  const stage = $("stage");
  const curPreset = `${state.graph.mode}:${state.graph.root || ""}`;
  stage.innerHTML = `
    <div class="subbar">
      <div class="subbar-group">
        <select class="select-clean" id="presetSelect">
          ${PRESETS.map((p) => `<option value="${esc(p.key)}" ${p.key === curPreset ? "selected" : ""}>${esc(p.label)}</option>`).join("")}
          ${PRESETS.some((p) => p.key === curPreset) ? "" : `<option value="${esc(curPreset)}" selected>Custom: ${esc(state.graph.root || "Full")}</option>`}
        </select>
        <div class="seg" id="graphModes">
          ${["parts", "trace", "used-by", "full"].map((m) =>
            `<button class="seg-btn ${state.graph.mode === m ? "active" : ""}" data-mode="${m}">${m === "used-by" ? "Used By" : m[0].toUpperCase() + m.slice(1)}</button>`
          ).join("")}
        </div>
      </div>
      <div class="subbar-group">
        <span class="meta-txt" id="graphMeta"></span>
        <button class="btn-sm" id="zoomOut">−</button>
        <button class="btn-sm" id="zoomFit">Fit</button>
        <button class="btn-sm" id="zoomIn">+</button>
      </div>
    </div>
    <div class="svg-wrap" id="svgWrap">
      <svg id="graph" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#94a3b8"></path>
          </marker>
          <marker id="arr-sel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d4ed8"></path>
          </marker>
        </defs>
        <g id="viewport"><g id="edgesLayer"></g><g id="nodesLayer"></g></g>
      </svg>
      <div class="hint">Drag nodes · Scroll to zoom · Double-click node to re-root · Click edge to cite</div>
    </div>
  `;

  $("presetSelect").onchange = (e) => {
    const idx = e.target.value.indexOf(":");
    loadGraphSub(e.target.value.slice(0, idx), e.target.value.slice(idx + 1) || null);
  };
  $("graphModes").querySelectorAll(".seg-btn").forEach((b) => {
    b.onclick = () => loadGraphSub(b.dataset.mode, state.selectedNodeId);
  });
  $("zoomFit").onclick = fitToView;
  $("zoomIn").onclick = () => { state.transform.k = Math.min(2.4, state.transform.k * 1.2); applyTransform(); };
  $("zoomOut").onclick = () => { state.transform.k = Math.max(0.25, state.transform.k / 1.2); applyTransform(); };

  bindPanZoom();
  computeLayout();
  renderSvg();
  fitToView();
}

function computeLayout() {
  const { nodes, edges } = visibleSubgraph();
  const colOf = new Map();

  if ((state.graph.mode === "parts" || state.graph.mode === "used-by") && state.graph.root) {
    const adj = new Map(nodes.map((n) => [n.id, []]));
    for (const e of edges) {
      if (state.graph.mode === "used-by") adj.get(e.target)?.push(e.subject);
      else adj.get(e.subject)?.push(e.target);
    }
    const q = [state.graph.root];
    colOf.set(state.graph.root, 0);
    while (q.length) {
      const cur = q.shift(), d = colOf.get(cur);
      for (const nxt of adj.get(cur) || []) {
        if (!colOf.has(nxt)) { colOf.set(nxt, d + 1); q.push(nxt); }
      }
    }
    for (const n of nodes) if (!colOf.has(n.id)) colOf.set(n.id, 1);
  } else {
    for (const n of nodes) {
      if (n.kind === "chemicalEntity" || n.kind === "structureModel") colOf.set(n.id, 0);
      else if (n.kind === "material") colOf.set(n.id, 1);
      else if (n.kind === "process") colOf.set(n.id, 2 + (STAGE_COL[n.stage] ?? 2));
      else if (n.kind === "productModel") colOf.set(n.id, 3);
      else if (n.kind === "productVariant" || n.kind === "requirement") colOf.set(n.id, 4);
      else if (n.kind === "referenceDesign") colOf.set(n.id, 5);
      else colOf.set(n.id, 6);
    }
  }

  const buckets = new Map();
  for (const n of nodes) {
    const c = colOf.get(n.id) ?? 0;
    if (!buckets.has(c)) buckets.set(c, []);
    buckets.get(c).push(n);
  }
  const cols = [...buckets.keys()].sort((a, b) => a - b);
  const W = 192, H = 52, CG = 96, RG = 20;
  const maxRows = Math.max(1, ...cols.map((c) => buckets.get(c).length));
  const totalH = maxRows * (H + RG);

  state.positions.clear();
  cols.forEach((c, ci) => {
    const list = buckets.get(c).sort((a, b) => a.kind.localeCompare(b.kind) || a.label.localeCompare(b.label));
    const colH = list.length * (H + RG) - RG;
    const y0 = (totalH - colH) / 2;
    list.forEach((n, ri) => state.positions.set(n.id, { x: ci * (W + CG), y: y0 + ri * (H + RG), w: W, h: H }));
  });
}

function renderSvg() {
  const edgesLayer = $("edgesLayer"), nodesLayer = $("nodesLayer");
  if (!edgesLayer || !nodesLayer) return;
  const { nodes, edges } = visibleSubgraph();
  edgesLayer.innerHTML = "";
  nodesLayer.innerHTML = "";
  $("graphMeta").textContent = `${nodes.length} nodes · ${edges.length} links`;

  const dense = edges.length > 20;
  for (const e of edges) {
    const p1 = state.positions.get(e.subject), p2 = state.positions.get(e.target);
    if (!p1 || !p2) continue;
    const forward = p2.x >= p1.x;
    const x1 = forward ? p1.x + p1.w : p1.x, y1 = p1.y + p1.h / 2;
    const x2 = forward ? p2.x : p2.x + p2.w, y2 = p2.y + p2.h / 2;
    const dx = Math.max(38, Math.abs(x2 - x1) * 0.45);
    const d = `M ${x1} ${y1} C ${forward ? x1 + dx : x1 - dx} ${y1}, ${forward ? x2 - dx : x2 + dx} ${y2}, ${x2} ${y2}`;
    const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
    const isSel = state.selectedStatementId === e.id;
    const isInc = e.subject === state.selectedNodeId || e.target === state.selectedNodeId;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", `edge-group ${dense && !isSel && !isInc ? "dim-label" : ""}`);

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", `edge-path ${isSel ? "selected" : ""}`);
    path.setAttribute("marker-end", isSel ? "url(#arr-sel)" : "url(#arr)");

    const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hit.setAttribute("d", d);
    hit.setAttribute("class", "edge-hit");
    hit.onclick = (ev) => { ev.stopPropagation(); inspectStatement(e); };

    const lbl = e.qualifiers?.position ? `${e.predicate} · ${e.qualifiers.position}` : e.predicate;
    const bw = Math.max(38, lbl.length * 5.6 + 10);
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    bg.setAttribute("x", mx - bw / 2); bg.setAttribute("y", my - 8); bg.setAttribute("width", bw); bg.setAttribute("height", 15);
    bg.setAttribute("class", "edge-label-bg");

    const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    txt.setAttribute("x", mx); txt.setAttribute("y", my + 2.5);
    txt.setAttribute("class", `edge-label ${isSel ? "selected" : ""}`);
    txt.textContent = lbl;

    g.append(path, hit, bg, txt);
    edgesLayer.appendChild(g);
  }

  for (const n of nodes) {
    const pos = state.positions.get(n.id);
    if (!pos) continue;
    const st = KIND_STYLE[n.kind] || KIND_STYLE.source;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", `g-node ${state.selectedNodeId === n.id ? "selected" : ""}`);
    g.setAttribute("transform", `translate(${pos.x},${pos.y})`);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("width", pos.w); rect.setAttribute("height", pos.h);
    rect.setAttribute("fill", st.fill); rect.setAttribute("stroke", st.border);

    const kTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    kTxt.setAttribute("x", 10); kTxt.setAttribute("y", 15); kTxt.setAttribute("fill", st.color);
    kTxt.setAttribute("class", "g-node-kind");
    kTxt.textContent = n.stage ? `${st.label} · ${n.stage}` : st.label;

    const tTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    tTxt.setAttribute("x", 10); tTxt.setAttribute("y", 31); tTxt.setAttribute("class", "g-node-title");
    tTxt.textContent = trunc(n.label, 24);

    const iTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    iTxt.setAttribute("x", 10); iTxt.setAttribute("y", 44); iTxt.setAttribute("class", "g-node-sub");
    iTxt.textContent = trunc(n.id, 27);

    g.append(rect, kTxt, tTxt, iTxt);
    attachDrag(g, n);
    nodesLayer.appendChild(g);
  }
  applyTransform();
}

function applyTransform() {
  const vp = $("viewport");
  if (vp) vp.setAttribute("transform", `translate(${state.transform.x},${state.transform.y}) scale(${state.transform.k})`);
}

function fitToView() {
  const wrap = $("svgWrap")?.getBoundingClientRect();
  if (!wrap || !state.positions.size || !wrap.width || !wrap.height) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of state.positions.values()) {
    minX = Math.min(minX, p.x); minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + p.w); maxY = Math.max(maxY, p.y + p.h);
  }
  const pad = 44, gw = Math.max(1, maxX - minX), gh = Math.max(1, maxY - minY);
  const k = Math.min(1.15, Math.min((wrap.width - pad * 2) / gw, (wrap.height - pad * 2) / gh));
  state.transform = { k, x: (wrap.width - gw * k) / 2 - minX * k, y: (wrap.height - gh * k) / 2 - minY * k };
  applyTransform();
}

function attachDrag(el, node) {
  let sx, sy, ox, oy, moved = false;
  el.addEventListener("pointerdown", (ev) => {
    ev.stopPropagation();
    el.setPointerCapture(ev.pointerId);
    const pos = state.positions.get(node.id);
    sx = ev.clientX; sy = ev.clientY; ox = pos.x; oy = pos.y; moved = false;
    const onMove = (e) => {
      const dx = (e.clientX - sx) / state.transform.k, dy = (e.clientY - sy) / state.transform.k;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      pos.x = ox + dx; pos.y = oy + dy;
      renderSvg();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (!moved) selectNode(node.id);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });
  el.ondblclick = (ev) => { ev.stopPropagation(); loadGraphSub(state.graph.mode === "full" ? "trace" : state.graph.mode, node.id); };
}

function bindPanZoom() {
  const wrap = $("svgWrap");
  let pan = false, sx = 0, sy = 0, ox = 0, oy = 0;
  wrap.onpointerdown = (ev) => { pan = true; sx = ev.clientX; sy = ev.clientY; ox = state.transform.x; oy = state.transform.y; };
  window.onpointermove = (ev) => {
    if (!pan) return;
    state.transform.x = ox + (ev.clientX - sx);
    state.transform.y = oy + (ev.clientY - sy);
    applyTransform();
  };
  window.onpointerup = () => { pan = false; };
  wrap.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    const nextK = Math.max(0.25, Math.min(2.4, state.transform.k * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
    const r = nextK / state.transform.k;
    state.transform.x = mx - (mx - state.transform.x) * r;
    state.transform.y = my - (my - state.transform.y) * r;
    state.transform.k = nextK;
    applyTransform();
  }, { passive: false });
}

      <div class="cite-card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <span class="mono" style="font-weight:600">${esc(state.citation.statement.id)}</span>
          <span class="tag ${ev.capture === "saved" ? "tag-teal" : "tag-amber"}">${esc(ev.capture)}</span>
        </div>
        <div style="font-weight:600;font-size:12.5px">${esc(ev.source.label)}</div>
        <div class="cite-kv">
          ${Object.entries(ev.locator || {}).map(([k, v]) => `<span class="meta-txt">${esc(k)}</span><span>${esc(v)}</span>`).join("")}
        </div>
        <a class="open-btn" href="${esc(ev.webHref || ev.href)}" target="_blank" rel="noopener">
          Open ${ev.capture === "saved" ? "archived snapshot" : "source URL"} ↗
        </a>
      </div>`).join("");
  })();

  const linkRow = (r, dir) => {
    const otherId = dir === "out" ? r.target : r.subject;
    const other = state.full.byId.get(otherId);
    const qual = fmtQual(r.qualifiers);
    return `<div class="link-row">
      <div class="link-main">
        <div class="meta-txt">${dir === "out" ? "→" : "←"} ${esc(r.predicate)}${qual ? ` · ${esc(qual)}` : ""}</div>
        <button class="link-btn" data-jump="${esc(otherId)}">${esc(other?.label || otherId)}</button>
      </div>
      <button class="cite-link" data-cite="${esc(r.id)}">cite</button>
    </div>`;
  };

  el.innerHTML = `
    <div class="insp-head">
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <span class="tag">${esc(node.kind)}</span>
        ${node.stage ? `<span class="tag">${esc(node.stage)}</span>` : ""}
        ${node.scale ? `<span class="tag">${esc(node.scale)}</span>` : ""}
        ${nodeGaps.length ? `<span class="tag tag-amber">${nodeGaps.length} gap${nodeGaps.length > 1 ? "s" : ""}</span>` : ""}
      </div>
      <h2 class="insp-title">${esc(node.label)}</h2>
      <div class="meta-txt">${esc(node.id)}</div>
      ${node.description ? `<div style="font-size:12px;color:var(--muted);margin-top:2px">${esc(node.description)}</div>` : ""}
      <div class="insp-actions">
        <button class="btn-sm" data-root="parts">Parts</button>
        <button class="btn-sm" data-root="trace">Trace</button>
        <button class="btn-sm" data-root="used-by">Used By</button>
      </div>
    </div>
    ${citeHtml}
    ${nodeGaps.length ? `<div>
      <div class="insp-section-title"><span>Gaps on this node</span><span>${nodeGaps.length}</span></div>
      ${nodeGaps.map((g) => `<div style="font-size:12px;color:var(--amber);padding:3px 0">• ${esc(g.message)}</div>`).join("")}
    </div>` : ""}
    ${facts.length ? `<div>
      <div class="insp-section-title"><span>Direct Facts</span><span>${facts.length}</span></div>
      ${facts.map((f) => `<div class="fact-row">
        <div class="fact-line">
          <span class="mono">${esc(f.property)}</span>
          <span class="fact-val ${f.state ? "unknown" : ""}">${esc(fmtFact(f))}</span>
        </div>
        <div class="fact-line">
          <span class="meta-txt">${esc([f.basis, f.scope].filter(Boolean).join(" · "))}</span>
          <button class="cite-link" data-cite="${esc(f.id)}">cite</button>
        </div>
        ${f.conditions ? `<div style="font-size:11.5px;color:var(--muted)">${esc(f.conditions)}</div>` : ""}
      </div>`).join("")}
    </div>` : ""}
    <div>
      <div class="insp-section-title"><span>Outgoing</span><span>${outgoing.length}</span></div>
      ${outgoing.length ? outgoing.map((r) => linkRow(r, "out")).join("") : `<div class="empty">None</div>`}
    </div>
    <div>
      <div class="insp-section-title"><span>Incoming</span><span>${incoming.length}</span></div>
      ${incoming.length ? incoming.map((r) => linkRow(r, "in")).join("") : `<div class="empty">None</div>`}
    </div>
  `;

  el.querySelectorAll("[data-root]").forEach((b) => b.onclick = () => loadGraphSub(b.dataset.root, node.id));
  el.querySelectorAll("[data-jump]").forEach((b) => b.onclick = () => selectNode(b.dataset.jump));
  el.querySelectorAll("[data-cite]").forEach((b) => b.onclick = () => {
    const st = state.full.statements.find((s) => s.id === b.dataset.cite);
    if (st) inspectStatement(st);
  });
}

/* ---------- Navigation & Quick Jump ---------- */

$("mainNav").querySelectorAll(".nav-btn").forEach((b) => b.onclick = () => setTab(b.dataset.tab));

const jumpInput = $("jumpInput"), jumpMenu = $("jumpMenu");
function renderJump() {
  const q = jumpInput.value.trim().toLowerCase();
  const matches = state.full.nodes.filter((n) =>
    !q || n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) || n.kind.toLowerCase().includes(q)
  ).slice(0, 12);
  jumpMenu.innerHTML = matches.length ? matches.map((n) => `
    <button class="jump-item" data-jid="${esc(n.id)}">
      <span class="jump-item-label">${esc(n.label)}</span>
      <span class="jump-item-sub">${esc(n.id)} · ${esc(n.kind)}</span>
    </button>`).join("") : `<div class="empty" style="padding:8px">No matches</div>`;
  jumpMenu.querySelectorAll("[data-jid]").forEach((b) => b.onclick = () => {
    selectNode(b.dataset.jid);
    jumpMenu.classList.remove("open");
    jumpInput.value = "";
  });
}
jumpInput.onfocus = () => { renderJump(); jumpMenu.classList.add("open"); };
jumpInput.oninput = () => { renderJump(); jumpMenu.classList.add("open"); };
document.addEventListener("click", (e) => { if (!e.target.closest(".jump-wrap")) jumpMenu.classList.remove("open"); });

loadInitial();
</script>
</body>
</html>
