<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building Materials Graph Explorer</title>
<style>
  :root {
    --bg: #f6f5f0;
    --surface: #ffffff;
    --surface-muted: #f0eee7;
    --border: #e2dfd5;
    --border-strong: #cbc6b8;
    --ink: #1a1917;
    --ink-muted: #5e5b53;
    --ink-subtle: #8b877d;
    --accent: #1d4ed8;
    --accent-soft: #eff6ff;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 13px; line-height: 1.45; }
  button, input, select { font: inherit; color: inherit; }

  .app { display: grid; grid-template-rows: 52px 1fr; height: 100vh; overflow: hidden; }

  /* Top Bar */
  .topbar {
    display: flex; align-items: center; gap: 10px; padding: 0 16px;
    background: var(--surface); border-bottom: 1px solid var(--border); z-index: 10;
  }
  .brand { display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
  .brand h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -0.01em; }
  .brand .stats { font-family: var(--mono); font-size: 11px; color: var(--ink-subtle); }

  .presets { display: flex; gap: 6px; margin-left: 6px; flex-wrap: nowrap; overflow-x: auto; }
  .preset-btn {
    border: 1px solid var(--border); background: var(--bg); padding: 4px 10px; border-radius: 999px;
    font-size: 12px; cursor: pointer; white-space: nowrap; transition: all 0.12s;
  }
  .preset-btn:hover { border-color: var(--border-strong); background: var(--surface-muted); }
  .preset-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }

  .search-wrap { margin-left: auto; position: relative; width: 220px; flex-shrink: 0; }
  .search-wrap input {
    width: 100%; padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); font-size: 12px; outline: none;
  }
  .search-wrap input:focus { border-color: var(--ink); background: var(--surface); }

  /* Main 3-Pane Workspace */
  .workspace { display: grid; grid-template-columns: 256px 1fr 365px; min-height: 0; }

  /* Left Sidebar */
  .sidebar {
    background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .kind-filters {
    display: flex; flex-wrap: wrap; gap: 4px; padding: 10px 12px; border-bottom: 1px solid var(--border);
  }
  .kind-chip {
    font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
  }
  .kind-chip.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .kind-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

  .node-list { overflow-y: auto; padding: 6px; flex: 1; }
  .node-group-title {
    font-size: 10px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-subtle); padding: 8px 8px 4px;
  }
  .node-item {
    display: flex; flex-direction: column; gap: 2px; padding: 6px 8px; border-radius: 6px;
    cursor: pointer; border: 1px solid transparent;
  }
  .node-item:hover { background: var(--bg); }
  .node-item.selected { background: var(--accent-soft); border-color: #bfdbfe; }
  .node-item-top { display: flex; align-items: center; gap: 6px; }
  .node-item-label { font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .node-item-id { font-family: var(--mono); font-size: 10.5px; color: var(--ink-subtle); padding-left: 13px; }

  /* Center Canvas */
  .canvas-pane { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg); }
  .canvas-toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 8px 12px; background: rgba(246, 245, 240, 0.94); border-bottom: 1px solid var(--border);
    backdrop-filter: blur(6px); z-index: 5; flex-wrap: wrap;
  }
  .mode-tabs { display: inline-flex; background: var(--surface-muted); padding: 2px; border-radius: 7px; border: 1px solid var(--border); flex-shrink: 0; }
  .mode-tab {
    border: none; background: transparent; padding: 4px 9px; border-radius: 5px;
    font-size: 12px; cursor: pointer; color: var(--ink-muted); font-weight: 500; white-space: nowrap;
  }
  .mode-tab.active { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.06); }

  .canvas-meta { display: flex; align-items: center; gap: 10px; font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; }
  .toggle-label { display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none; white-space: nowrap; }
  .zoom-controls { display: inline-flex; gap: 4px; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 5px;
    padding: 3px 8px; font-size: 12px; cursor: pointer;
  }
  .icon-btn:hover { border-color: var(--border-strong); }

  .svg-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; }
  .svg-wrap:active { cursor: grabbing; }
  svg#graph { width: 100%; height: 100%; display: block; }

  .legend {
    position: absolute; left: 12px; bottom: 12px; background: rgba(255,255,255,0.92);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px;
    display: flex; align-items: center; gap: 12px; font-size: 11px; color: var(--ink-muted);
    backdrop-filter: blur(4px); pointer-events: none;
  }

  /* Compare Panel */
  .compare-wrap {
    flex: 1; overflow-y: auto; padding: 18px 20px; display: none; flex-direction: column; gap: 16px;
  }
  .compare-wrap.visible { display: flex; }
  .compare-pickers {
    display: grid; grid-template-columns: 1fr auto 1fr; gap: 10px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px;
  }
  .compare-pickers select {
    width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 12.5px;
  }
  .compare-vs { font-family: var(--mono); font-size: 11px; color: var(--ink-subtle); font-weight: 600; text-transform: uppercase; }
  .compare-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px;
  }
  .compare-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .compare-table th, .compare-table td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  .compare-table th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink-subtle); font-weight: 650; }
  .compare-table tr.diff-row td { background: #fffbeb; }
  .diff-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .diff-col { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; }
  .diff-col-title { font-size: 11px; font-weight: 650; color: var(--ink-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .diff-chip {
    display: flex; flex-direction: column; gap: 1px; width: 100%; text-align: left;
    padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
    margin-bottom: 6px; cursor: pointer;
  }
  .diff-chip:hover { border-color: var(--accent); background: var(--accent-soft); }
  .diff-chip-label { font-size: 12px; font-weight: 550; }
  .diff-chip-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-subtle); }

  /* SVG Elements */
  .edge-path { fill: none; stroke: #0f766e; stroke-width: 1.7; transition: stroke 0.12s, stroke-width 0.12s; cursor: pointer; }
  .edge-path:hover, .edge-path.selected { stroke: #1d4ed8; stroke-width: 2.6; }
  .edge-hit { fill: none; stroke: transparent; stroke-width: 12; cursor: pointer; }
  .edge-label-bg { fill: #f6f5f0; opacity: 0.92; rx: 3; }
  .edge-label { font-family: var(--mono); font-size: 9.5px; fill: #475569; pointer-events: none; text-anchor: middle; }
  .edge-label.selected { fill: #1d4ed8; font-weight: 600; }
  .edge-group.dim-label .edge-label-bg, .edge-group.dim-label .edge-label { opacity: 0; transition: opacity 0.12s; }
  .edge-group.dim-label:hover .edge-label-bg, .edge-group.dim-label:hover .edge-label { opacity: 0.95; }

  .g-node { cursor: pointer; }
  .g-node rect { rx: 8; ry: 8; stroke-width: 1.4; transition: filter 0.12s; }
  .g-node:hover rect { filter: drop-shadow(0 3px 6px rgba(0,0,0,0.08)); }
  .g-node.selected rect { stroke-width: 2.5; stroke: #1d4ed8 !important; filter: drop-shadow(0 0 0 3px rgba(29,78,216,0.18)); }
  .g-node.root rect { stroke-width: 2.2; }
  .g-node-kind { font-family: var(--mono); font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .g-node-title { font-size: 11.5px; font-weight: 600; fill: #1a1917; }
  .g-node-sub { font-family: var(--mono); font-size: 9.5px; fill: #64748b; }

  /* Right Inspector */
  .inspector {
    background: var(--surface); border-left: 1px solid var(--border);
    overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 16px;
  }
  .insp-header { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
  .pill-row { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .pill {
    display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px;
    font-size: 10.5px; font-family: var(--mono); font-weight: 500; border: 1px solid var(--border); background: var(--bg);
  }
  .pill.basis-simulated, .pill.basis-measured, .pill.basis-manufacturer-declared, .pill.basis-specification, .pill.basis-typical-reference, .pill.basis-inferred {
    background: #ecfdf5; border-color: #a7f3d0; color: #065f46;
  }
  .pill.capture-saved { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; }
  .pill.capture-link-only { background: #fef3c7; border-color: #fcd34d; color: #92400e; }

  .insp-title { margin: 0; font-size: 16px; font-weight: 650; line-height: 1.25; }
  .insp-id { font-family: var(--mono); font-size: 11.5px; color: var(--ink-subtle); }
  .insp-desc { margin: 2px 0 0; font-size: 12.5px; color: var(--ink-muted); }

  .action-row { display: flex; gap: 6px; margin-top: 4px; }
  .action-btn {
    flex: 1; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); font-size: 11.5px; font-weight: 500; cursor: pointer; text-align: center;
  }
  .action-btn:hover { background: var(--surface-muted); border-color: var(--border-strong); }

  .section-title {
    font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--ink-subtle); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center;
  }

  .card {
    border: 1px solid var(--border); border-radius: 8px; padding: 9px 10px; background: var(--bg);
    display: flex; flex-direction: column; gap: 5px; margin-bottom: 8px;
  }
  .card.active-cite { border-color: var(--accent); background: var(--accent-soft); }
  .fact-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .fact-prop { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--ink); }
  .fact-val { font-family: var(--mono); font-size: 13px; font-weight: 700; color: #0f766e; }
  .fact-val.unknown { color: #b45309; font-style: italic; font-weight: 600; }
  .fact-meta { font-size: 11.5px; color: var(--ink-muted); }

  .rel-row {
    display: flex; flex-direction: column; gap: 3px; padding: 7px 9px;
    border: 1px solid var(--border); border-radius: 7px; margin-bottom: 6px; background: var(--surface);
  }
  .rel-row.active-cite { border-color: var(--accent); background: var(--accent-soft); }
  .rel-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .rel-pred { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--ink-muted); }
  .rel-link {
    background: none; border: none; padding: 0; text-align: left; cursor: pointer;
    color: var(--accent); font-weight: 550; font-size: 12.5px;
  }
  .rel-link:hover { text-decoration: underline; }
  .rel-qual { font-family: var(--mono); font-size: 10.5px; color: var(--ink-subtle); }

  .cite-btn {
    border: 1px solid var(--border); background: var(--surface); border-radius: 5px;
    padding: 1px 7px; font-size: 10.5px; font-family: var(--mono); cursor: pointer; color: var(--ink-muted);
  }
  .cite-btn:hover { border-color: var(--ink); color: var(--ink); }

  .evidence-box {
    border: 1px solid #bfdbfe; background: #f8fbff; border-radius: 8px; padding: 11px 12px;
    display: flex; flex-direction: column; gap: 7px;
  }
  .evidence-kv { display: grid; grid-template-columns: 78px 1fr; gap: 3px 8px; font-size: 11.5px; }
  .evidence-k { font-family: var(--mono); color: var(--ink-subtle); font-size: 10.5px; }
  .evidence-v { word-break: break-word; }
  .open-source {
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
    padding: 6px 10px; border-radius: 6px; background: var(--ink); color: #fff;
    text-decoration: none; font-size: 12px; font-weight: 500; margin-top: 2px;
  }
  .open-source:hover { background: #333; }
  .empty { color: var(--ink-subtle); font-size: 12px; font-style: italic; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <h1>Building Materials</h1>
      <span class="stats" id="graphStats">loading...</span>
    </div>
    <div class="presets" id="presets">
      <button class="preset-btn active" data-preset="parts:window-assembly">Window → Atoms</button>
      <button class="preset-btn" data-preset="trace:igu-gray-argon">IGU Value Chain</button>
      <button class="preset-btn" data-preset="used-by:vitro-solarban-70">Where is Solarban 70 used?</button>
      <button class="preset-btn" data-preset="compare:igu-gray-air|igu-gray-argon">Compare Air vs. Argon</button>
      <button class="preset-btn" data-preset="full:">Full Graph</button>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Filter nodes by label, ID, kind..." autocomplete="off">
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="kind-filters" id="kindFilters"></div>
      <div class="node-list" id="nodeList"></div>
    </aside>

    <section class="canvas-pane">
      <div class="canvas-toolbar">
        <div class="mode-tabs" id="modeTabs">
          <button class="mode-tab active" data-mode="parts">Parts</button>
          <button class="mode-tab" data-mode="trace">Trace</button>
          <button class="mode-tab" data-mode="used-by">Used By</button>
          <button class="mode-tab" data-mode="compare">Compare</button>
          <button class="mode-tab" data-mode="full">Full</button>
        </div>
        <div class="canvas-meta" id="graphControls">
          <span id="viewSummary"></span>
          <label class="toggle-label"><input type="checkbox" id="toggleSources"> Sources</label>
          <div class="zoom-controls">
            <button class="icon-btn" id="zoomOut" title="Zoom out">−</button>
            <button class="icon-btn" id="zoomFit" title="Fit to view">Fit</button>
            <button class="icon-btn" id="zoomIn" title="Zoom in">+</button>
          </div>
        </div>
      </div>

      <div class="svg-wrap" id="svgWrap">
        <svg id="graph" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="arrow-verified" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f766e"></path>
            </marker>
            <marker id="arrow-selected" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#1d4ed8"></path>
            </marker>
          </defs>
          <g id="viewport">
            <g id="edgesLayer"></g>
            <g id="nodesLayer"></g>
          </g>
        </svg>
        <div class="legend">
          <span>Drag nodes · Scroll to zoom · Double-click node to re-root · Click edge to cite</span>
        </div>
      </div>

      <div class="compare-wrap" id="compareWrap"></div>
    </section>

    <aside class="inspector" id="inspector">
      <div class="empty">Select a node or edge to inspect claims and citations.</div>
    </aside>
  </main>
</div>

<script>
const KIND_STYLE = {
  referenceDesign: { color: "#1d4ed8", fill: "#eff6ff", border: "#93c5fd", label: "Design" },
  productModel:    { color: "#4f46e5", fill: "#eef2ff", border: "#c7d2fe", label: "Model" },
  productVariant:  { color: "#6d28d9", fill: "#f5f3ff", border: "#c4b5fd", label: "Variant" },
  material:        { color: "#0f766e", fill: "#f0fdfa", border: "#5eead4", label: "Material" },
  structureModel:  { color: "#047857", fill: "#ecfdf5", border: "#6ee7b7", label: "Structure" },
  chemicalEntity:  { color: "#0e7490", fill: "#ecfeff", border: "#67e8f9", label: "Chemical" },
  process:         { color: "#c2410c", fill: "#fff7ed", border: "#fdba74", label: "Process" },
  requirement:     { color: "#be123c", fill: "#fff1f2", border: "#fda4af", label: "Requirement" },
  actor:           { color: "#7e22ce", fill: "#faf5ff", border: "#d8b4fe", label: "Actor" },
  source:          { color: "#57534e", fill: "#f5f5f4", border: "#d6d3d1", label: "Source" },
};

const STAGE_COL = {
  extraction: 0, research: 0,
  design: 1, specification: 1,
  fabrication: 2,
  testing: 3,
  distribution: 4, installation: 4,
};

const state = {
  full: { nodes: [], statements: [], byId: new Map(), out: new Map(), inc: new Map() },
  view: { mode: "parts", root: "window-assembly", nodes: [], statements: [] },
  compare: { left: "igu-gray-air", right: "igu-gray-argon", data: null },
  selectedNodeId: "window-assembly",
  selectedStatementId: null,
  citation: null,
  activeKind: null,
  search: "",
  showSources: false,
  positions: new Map(),
  transform: { x: 40, y: 40, k: 1 },
};

const $ = (id) => document.getElementById(id);

async function api(path) {
  const res = await fetch(path);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function truncate(s, max = 26) {
  return s.length > max ? s.slice(0, max - 1) + "…" : s;
}

function formatQualifiers(q) {
  if (!q) return "";
  const parts = [];
  if (q.role) parts.push(`role: ${q.role}`);
  if (q.position) parts.push(`pos: ${q.position}`);
  if (q.sequence !== undefined) parts.push(`#${q.sequence}`);
  if (q.quantity) parts.push(formatQuantity(q.quantity));
  return parts.join(" · ");
}

function formatQuantity(q) {
  if (!q) return "";
  const unit = q.unit === "1" ? "" : ` ${q.unit}`;
  const val = q.value !== undefined ? `${q.value}` : `${q.min}–${q.max}`;
  return `${val}${unit}${q.basis ? ` (${q.basis})` : ""}`;
}

function formatFactValue(f) {
  if (!f) return "—";
  if (f.quantity) return formatQuantity(f.quantity);
  if (f.state) return f.state;
  return String(f.value);
}

function edgeShortLabel(st) {
  const q = st.qualifiers;
  if (q?.position) return `${st.predicate} · ${q.position}`;
  if (q?.role) return `${st.predicate} · ${q.role}`;
  return st.predicate;
}

/* ---------- Data Loading ---------- */

async function loadFullGraph() {
  const data = await api("/api/graph");
  state.full.nodes = data.nodes;
  state.full.statements = data.statements;
  state.full.byId = new Map(data.nodes.map((n) => [n.id, n]));
  state.full.out = new Map(data.nodes.map((n) => [n.id, []]));
  state.full.inc = new Map(data.nodes.map((n) => [n.id, []]));
  for (const st of data.statements) {
    state.full.out.get(st.subject)?.push(st);
    if (st.target) state.full.inc.get(st.target)?.push(st);
  }
  $("graphStats").textContent = `${data.nodes.length} nodes · ${data.statements.length} statements`;
  renderKindFilters();
  renderNodeList();
}

async function setView(mode, rootArg) {
  state.view.mode = mode;
  state.selectedStatementId = null;
  state.citation = null;

  if (mode === "compare") {
    if (rootArg && rootArg.includes("|")) {
      const [l, r] = rootArg.split("|");
      state.compare.left = l;
      state.compare.right = r;
    }
    $("svgWrap").style.display = "none";
    $("graphControls").style.display = "none";
    $("compareWrap").classList.add("visible");
    state.compare.data = await api(`/api/compare/${encodeURIComponent(state.compare.left)}/${encodeURIComponent(state.compare.right)}`);
    state.selectedNodeId = state.compare.left;
    updateToolbarUI();
    renderCompare();
    renderNodeList();
    renderInspector();
    return;
  }

  $("svgWrap").style.display = "block";
  $("graphControls").style.display = "flex";
  $("compareWrap").classList.remove("visible");

  if (mode === "full") {
    state.view.root = null;
    state.view.nodes = state.full.nodes;
    state.view.statements = state.full.statements;
  } else {
    const target = rootArg || state.selectedNodeId || "window-assembly";
    const data = await api(`/api/${mode}/${encodeURIComponent(target)}`);
    state.view.root = data.root;
    state.view.nodes = data.nodes;
    state.view.statements = data.statements;
    state.selectedNodeId = target;
  }
  updateToolbarUI();
  computeLayout();
  renderGraph();
  fitToView();
  renderNodeList();
  renderInspector();
}

/* ---------- Compare View ---------- */

function renderCompare() {
  const wrap = $("compareWrap");
  const d = state.compare.data;
  if (!d) return;

  const comparable = state.full.nodes.filter((n) => ["productVariant", "referenceDesign", "productModel"].includes(n.kind));
  const options = (sel) => comparable.map((n) =>
    `<option value="${esc(n.id)}" ${n.id === sel ? "selected" : ""}>${esc(n.label)} (${esc(n.kind)})</option>`
  ).join("");

  const factRows = d.facts.length ? d.facts.map((row) => {
    const lv = formatFactValue(row.left);
    const rv = formatFactValue(row.right);
    const diff = lv !== rv;
    const cell = (stmt) => {
      if (!stmt) return `<span class="empty">—</span>`;
      const inherited = stmt.subject !== d.left.id && stmt.subject !== d.right.id;
      return `<div><strong>${esc(formatFactValue(stmt))}</strong></div>
        <div style="display:flex;gap:5px;align-items:center;margin-top:3px;flex-wrap:wrap">
          <span class="pill basis-${esc(stmt.basis)}">${esc(stmt.basis)}</span>
          ${inherited ? `<span class="pill">via ${esc(stmt.subject)}</span>` : ""}
          <button class="cite-btn" data-cite="${esc(stmt.id)}">Cite</button>
        </div>`;
    };
    return `<tr class="${diff ? "diff-row" : ""}">
      <td><div class="fact-prop">${esc(row.property)}</div>${row.scope ? `<div class="rel-qual">${esc(row.scope)}</div>` : ""}</td>
      <td>${cell(row.left)}</td>
      <td>${cell(row.right)}</td>
    </tr>`;
  }).join("") : `<tr><td colspan="3" class="empty">No comparable property claims.</td></tr>`;

  const diffSection = (title, group) => {
    const col = (label, list) => `
      <div class="diff-col">
        <div class="diff-col-title">${esc(label)} (${list.length})</div>
        ${list.length ? list.map((n) => `
          <button class="diff-chip" data-jump="${esc(n.id)}">
            <span class="diff-chip-label">${esc(n.label)}</span>
            <span class="diff-chip-sub">${esc(n.id)}${n.stage ? ` · ${esc(n.stage)}` : ""}</span>
          </button>`).join("") : `<div class="empty">None</div>`}
      </div>`;
    return `
      <div class="compare-card">
        <h3 class="section-title">${esc(title)}</h3>
        <div class="diff-grid">
          ${col(`Only ${truncate(d.left.label, 22)}`, group.onlyLeft)}
          ${col("Shared", group.shared)}
          ${col(`Only ${truncate(d.right.label, 22)}`, group.onlyRight)}
        </div>
      </div>`;
  };

  wrap.innerHTML = `
    <div class="compare-pickers">
      <select id="cmpLeft">${options(d.left.id)}</select>
      <span class="compare-vs">vs</span>
      <select id="cmpRight">${options(d.right.id)}</select>
    </div>
    <div class="compare-card">
      <h3 class="section-title">Properties & Performance</h3>
      <table class="compare-table">
        <thead>
          <tr><th>Property</th><th>${esc(d.left.label)}</th><th>${esc(d.right.label)}</th></tr>
        </thead>
        <tbody>${factRows}</tbody>
      </table>
    </div>
    ${diffSection("Materials", d.materials)}
    ${diffSection("Value-Chain Processes", d.processes)}
    ${diffSection("Assembly Parts", d.parts)}
  `;

  $("cmpLeft").onchange = (e) => setView("compare", `${e.target.value}|${state.compare.right}`);
  $("cmpRight").onchange = (e) => setView("compare", `${state.compare.left}|${e.target.value}`);
  wrap.querySelectorAll("[data-jump]").forEach((b) => { b.onclick = () => selectNode(b.dataset.jump); });
  wrap.querySelectorAll("[data-cite]").forEach((b) => {
    b.onclick = () => {
      const targetSt = state.full.statements.find((s) => s.id === b.dataset.cite);
      if (targetSt) inspectStatement(targetSt);
    };
  });
}

/* ---------- Layered Layout ---------- */

function visibleSubgraph() {
  const nodes = state.view.nodes.filter((n) => state.showSources || n.kind !== "source");
  const nodeIds = new Set(nodes.map((n) => n.id));
  const edges = state.view.statements.filter(
    (s) => s.predicate && nodeIds.has(s.subject) && nodeIds.has(s.target)
  );
  return { nodes, edges };
}

function computeLayout() {
  const { nodes, edges } = visibleSubgraph();
  const colOf = new Map();

  if ((state.view.mode === "parts" || state.view.mode === "used-by") && state.view.root) {
    const adj = new Map(nodes.map((n) => [n.id, []]));
    for (const e of edges) {
      if (state.view.mode === "used-by") adj.get(e.target)?.push(e.subject);
      else adj.get(e.subject)?.push(e.target);
    }
    const queue = [state.view.root];
    colOf.set(state.view.root, 0);
    while (queue.length) {
      const cur = queue.shift();
      const d = colOf.get(cur);
      for (const nxt of adj.get(cur) || []) {
        if (!colOf.has(nxt)) {
          colOf.set(nxt, d + 1);
          queue.push(nxt);
        }
      }
    }
    for (const n of nodes) if (!colOf.has(n.id)) colOf.set(n.id, 1);
  } else {
    for (const n of nodes) {
      if (n.kind === "chemicalEntity" || n.kind === "structureModel") colOf.set(n.id, 0);
      else if (n.kind === "material") colOf.set(n.id, 1);
      else if (n.kind === "process") colOf.set(n.id, 2 + (STAGE_COL[n.stage] ?? 2));
      else if (n.kind === "productModel") colOf.set(n.id, 3);
      else if (n.kind === "productVariant" || n.kind === "requirement") colOf.set(n.id, 4);
      else if (n.kind === "referenceDesign") colOf.set(n.id, 5);
      else colOf.set(n.id, 6);
    }
  }

  const buckets = new Map();
  for (const n of nodes) {
    const c = colOf.get(n.id) ?? 0;
    if (!buckets.has(c)) buckets.set(c, []);
    buckets.get(c).push(n);
  }
  const cols = [...buckets.keys()].sort((a, b) => a - b);
  const NODE_W = 196, NODE_H = 54, COL_GAP = 100, ROW_GAP = 22;

  const maxRows = Math.max(1, ...cols.map((c) => buckets.get(c).length));
  const totalHeight = maxRows * (NODE_H + ROW_GAP);

  state.positions.clear();
  cols.forEach((c, ci) => {
    const list = buckets.get(c).sort((a, b) => a.kind.localeCompare(b.kind) || a.label.localeCompare(b.label));
    const colH = list.length * (NODE_H + ROW_GAP) - ROW_GAP;
    const startY = (totalHeight - colH) / 2;
    list.forEach((n, ri) => {
      state.positions.set(n.id, {
        x: ci * (NODE_W + COL_GAP),
        y: startY + ri * (NODE_H + ROW_GAP),
        w: NODE_W,
        h: NODE_H,
      });
    });
  });
}

/* ---------- SVG Rendering ---------- */

function renderGraph() {
  const { nodes, edges } = visibleSubgraph();
  const edgesLayer = $("edgesLayer");
  const nodesLayer = $("nodesLayer");
  edgesLayer.innerHTML = "";
  nodesLayer.innerHTML = "";

  $("viewSummary").textContent = `${nodes.length} nodes · ${edges.length} links`;

  const dense = edges.length > 22;
  for (const e of edges) {
    const p1 = state.positions.get(e.subject);
    const p2 = state.positions.get(e.target);
    if (!p1 || !p2) continue;

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const { d, mx, my } = edgeGeometry(p1, p2);
    const isSel = state.selectedStatementId === e.id;
    const isIncident = e.subject === state.selectedNodeId || e.target === state.selectedNodeId;
    g.setAttribute("class", `edge-group ${dense && !isSel && !isIncident ? "dim-label" : ""}`);

    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d);
    path.setAttribute("class", `edge-path ${isSel ? "selected" : ""}`);
    path.setAttribute("marker-end", isSel ? "url(#arrow-selected)" : "url(#arrow-verified)");

    const hit = document.createElementNS("http://www.w3.org/2000/svg", "path");
    hit.setAttribute("d", d);
    hit.setAttribute("class", "edge-hit");
    hit.addEventListener("click", (ev) => {
      ev.stopPropagation();
      inspectStatement(e);
    });

    const lblText = edgeShortLabel(e);
    const bg = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    const bw = Math.max(40, lblText.length * 5.6 + 10);
    bg.setAttribute("x", mx - bw / 2);
    bg.setAttribute("y", my - 8);
    bg.setAttribute("width", bw);
    bg.setAttribute("height", 15);
    bg.setAttribute("class", "edge-label-bg");

    const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
    text.setAttribute("x", mx);
    text.setAttribute("y", my + 2.5);
    text.setAttribute("class", `edge-label ${isSel ? "selected" : ""}`);
    text.textContent = lblText;

    g.append(path, hit, bg, text);
    edgesLayer.appendChild(g);
  }

  for (const n of nodes) {
    const pos = state.positions.get(n.id);
    if (!pos) continue;
    const style = KIND_STYLE[n.kind] || KIND_STYLE.source;
    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    const isSel = state.selectedNodeId === n.id;
    const isRoot = state.view.root === n.id;
    g.setAttribute("class", `g-node ${isSel ? "selected" : ""} ${isRoot ? "root" : ""}`);
    g.setAttribute("transform", `translate(${pos.x},${pos.y})`);

    const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
    rect.setAttribute("width", pos.w);
    rect.setAttribute("height", pos.h);
    rect.setAttribute("fill", style.fill);
    rect.setAttribute("stroke", style.border);

    const kindTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    kindTxt.setAttribute("x", 10);
    kindTxt.setAttribute("y", 15);
    kindTxt.setAttribute("fill", style.color);
    kindTxt.setAttribute("class", "g-node-kind");
    kindTxt.textContent = n.stage ? `${style.label} · ${n.stage}` : style.label;

    const titleTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    titleTxt.setAttribute("x", 10);
    titleTxt.setAttribute("y", 32);
    titleTxt.setAttribute("class", "g-node-title");
    titleTxt.textContent = truncate(n.label, 25);

    const idTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
    idTxt.setAttribute("x", 10);
    idTxt.setAttribute("y", 46);
    idTxt.setAttribute("class", "g-node-sub");
    idTxt.textContent = truncate(n.id, 28);

    g.append(rect, kindTxt, titleTxt, idTxt);
    attachNodeDrag(g, n);
    nodesLayer.appendChild(g);
  }
  applyTransform();
}

function edgeGeometry(p1, p2) {
  const forward = p2.x >= p1.x;
  const x1 = forward ? p1.x + p1.w : p1.x;
  const y1 = p1.y + p1.h / 2;
  const x2 = forward ? p2.x : p2.x + p2.w;
  const y2 = p2.y + p2.h / 2;
  const dx = Math.max(40, Math.abs(x2 - x1) * 0.45);
  const c1x = forward ? x1 + dx : x1 - dx;
  const c2x = forward ? x2 - dx : x2 + dx;
  const d = `M ${x1} ${y1} C ${c1x} ${y1}, ${c2x} ${y2}, ${x2} ${y2}`;
  return { d, mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
}

function applyTransform() {
  const { x, y, k } = state.transform;
  $("viewport").setAttribute("transform", `translate(${x},${y}) scale(${k})`);
}

function fitToView() {
  const wrap = $("svgWrap").getBoundingClientRect();
  if (!state.positions.size || !wrap.width || !wrap.height) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const p of state.positions.values()) {
    minX = Math.min(minX, p.x);
    minY = Math.min(minY, p.y);
    maxX = Math.max(maxX, p.x + p.w);
    maxY = Math.max(maxY, p.y + p.h);
  }
  const pad = 48;
  const gw = Math.max(1, maxX - minX);
  const gh = Math.max(1, maxY - minY);
  const k = Math.min(1.15, Math.min((wrap.width - pad * 2) / gw, (wrap.height - pad * 2) / gh));
  state.transform = {
    k,
    x: (wrap.width - gw * k) / 2 - minX * k,
    y: (wrap.height - gh * k) / 2 - minY * k,
  };
  applyTransform();
}

/* ---------- Dragging, Panning & Zooming ---------- */

function attachNodeDrag(el, node) {
  let startX, startY, origX, origY, moved = false;
  el.addEventListener("pointerdown", (ev) => {
    ev.stopPropagation();
    el.setPointerCapture(ev.pointerId);
    const pos = state.positions.get(node.id);
    startX = ev.clientX;
    startY = ev.clientY;
    origX = pos.x;
    origY = pos.y;
    moved = false;

    const onMove = (e) => {
      const dx = (e.clientX - startX) / state.transform.k;
      const dy = (e.clientY - startY) / state.transform.k;
      if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;
      if (!moved) return;
      pos.x = origX + dx;
      pos.y = origY + dy;
      renderGraph();
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      if (!moved) selectNode(node.id);
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
  });

  el.addEventListener("dblclick", (ev) => {
    ev.stopPropagation();
    const mode = state.view.mode === "full" ? "trace" : state.view.mode;
    setView(mode, node.id);
  });
}

(function initPanZoom() {
  const wrap = $("svgWrap");
  let panning = false, sx = 0, sy = 0, ox = 0, oy = 0;
  wrap.addEventListener("pointerdown", (ev) => {
    panning = true; sx = ev.clientX; sy = ev.clientY; ox = state.transform.x; oy = state.transform.y;
  });
  window.addEventListener("pointermove", (ev) => {
    if (!panning) return;
    state.transform.x = ox + (ev.clientX - sx);
    state.transform.y = oy + (ev.clientY - sy);
    applyTransform();
  });
  window.addEventListener("pointerup", () => { panning = false; });

  wrap.addEventListener("wheel", (ev) => {
    ev.preventDefault();
    const rect = wrap.getBoundingClientRect();
    const mx = ev.clientX - rect.left;
    const my = ev.clientY - rect.top;
    const factor = ev.deltaY < 0 ? 1.12 : 1 / 1.12;
    const nextK = Math.max(0.25, Math.min(2.5, state.transform.k * factor));
    const ratio = nextK / state.transform.k;
    state.transform.x = mx - (mx - state.transform.x) * ratio;
    state.transform.y = my - (my - state.transform.y) * ratio;
    state.transform.k = nextK;
    applyTransform();
  }, { passive: false });
})();

/* ---------- Sidebar & Inspector ---------- */

function renderKindFilters() {
  const counts = new Map();
  for (const n of state.full.nodes) counts.set(n.kind, (counts.get(n.kind) || 0) + 1);
  const el = $("kindFilters");
  el.innerHTML = `<button class="kind-chip ${state.activeKind === null ? "active" : ""}" data-kind="">All (${state.full.nodes.length})</button>` +
    [...counts.entries()].map(([k, count]) => {
      const st = KIND_STYLE[k] || KIND_STYLE.source;
      return `<button class="kind-chip ${state.activeKind === k ? "active" : ""}" data-kind="${k}">
        <span class="kind-dot" style="background:${st.color}"></span>${st.label} (${count})
      </button>`;
    }).join("");
  el.querySelectorAll(".kind-chip").forEach((btn) => {
    btn.onclick = () => {
      state.activeKind = btn.dataset.kind || null;
      renderKindFilters();
      renderNodeList();
    };
  });
}

function renderNodeList() {
  const q = state.search.trim().toLowerCase();
  const filtered = state.full.nodes.filter((n) => {
    if (state.activeKind && n.kind !== state.activeKind) return false;
    if (!q) return true;
    return n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q)
      || n.kind.toLowerCase().includes(q) || (n.stage || "").toLowerCase().includes(q);
  });

  const groups = new Map();
  for (const n of filtered) {
    if (!groups.has(n.kind)) groups.set(n.kind, []);
    groups.get(n.kind).push(n);
  }

  const el = $("nodeList");
  if (!filtered.length) {
    el.innerHTML = `<div class="empty" style="padding:12px">No matching nodes.</div>`;
    return;
  }

  el.innerHTML = [...groups.entries()].map(([kind, list]) => {
    const st = KIND_STYLE[kind] || KIND_STYLE.source;
    return `<div class="node-group-title">${st.label}</div>` +
      list.map((n) => `
        <div class="node-item ${state.selectedNodeId === n.id ? "selected" : ""}" data-id="${esc(n.id)}">
          <div class="node-item-top">
            <span class="kind-dot" style="background:${st.color}"></span>
            <span class="node-item-label">${esc(n.label)}</span>
          </div>
          <div class="node-item-id">${esc(n.id)}${n.stage ? ` · ${esc(n.stage)}` : ""}</div>
        </div>
      `).join("");
  }).join("");

  el.querySelectorAll(".node-item").forEach((row) => {
    row.onclick = () => selectNode(row.dataset.id);
    row.ondblclick = () => setView(state.view.mode === "full" || state.view.mode === "compare" ? "trace" : state.view.mode, row.dataset.id);
  });
}

function selectNode(nodeId) {
  state.selectedNodeId = nodeId;
  state.selectedStatementId = null;
  state.citation = null;
  renderNodeList();
  if (state.view.mode !== "compare") renderGraph();
  renderInspector();
}

async function inspectStatement(st) {
  state.selectedStatementId = st.id;
  if (st.subject && state.selectedNodeId !== st.subject) {
    state.selectedNodeId = st.subject;
  }
  if (state.view.mode !== "compare") renderGraph();
  renderInspector();
  try {
    state.citation = await api(`/api/cite/${encodeURIComponent(st.id)}`);
    renderInspector();
  } catch (err) {
    state.citation = { error: err.message };
    renderInspector();
  }
}

function renderInspector() {
  const el = $("inspector");
  const node = state.full.byId.get(state.selectedNodeId);
  if (!node) {
    el.innerHTML = `<div class="empty">Select a node to inspect.</div>`;
    return;
  }

  const st = KIND_STYLE[node.kind] || KIND_STYLE.source;
  const outAll = state.full.out.get(node.id) || [];
  const facts = outAll.filter((r) => "property" in r);
  const outgoing = outAll.filter((r) => "predicate" in r);
  const incoming = state.full.inc.get(node.id) || [];

  const metaPills = [
    `<span class="pill" style="background:${st.fill};border-color:${st.border};color:${st.color}">${esc(node.kind)}</span>`,
    node.stage ? `<span class="pill">stage: ${esc(node.stage)}</span>` : "",
    node.scale ? `<span class="pill">scale: ${esc(node.scale)}</span>` : "",
    node.revision ? `<span class="pill">rev: ${esc(node.revision)}</span>` : "",
  ].filter(Boolean).join("");

  const sourceBlock = node.source ? `
    <div class="evidence-box">
      <div class="section-title" style="margin:0">Source metadata</div>
      <div class="evidence-kv">
        <span class="evidence-k">issuer</span><span class="evidence-v">${esc(node.source.issuer || "—")}</span>
        <span class="evidence-k">mediaType</span><span class="evidence-v">${esc(node.source.mediaType)}</span>
        <span class="evidence-k">origin</span><span class="evidence-v"><a href="${esc(node.source.origin)}" target="_blank" rel="noopener">${esc(node.source.origin)}</a></span>
        ${node.source.sha256 ? `<span class="evidence-k">sha256</span><span class="evidence-v" style="font-family:var(--mono)">${esc(node.source.sha256.slice(0, 16))}…</span>` : ""}
      </div>
    </div>` : "";

  const citationBlock = renderCitationBlock();

  const factsHtml = facts.length ? facts.map((f) => {
    const valHtml = f.quantity
      ? `<span class="fact-val">${esc(formatQuantity(f.quantity))}</span>`
      : f.state
        ? `<span class="fact-val unknown">${esc(f.state)}</span>`
        : `<span class="fact-val">${esc(String(f.value))}</span>`;
    return `
      <div class="card ${state.selectedStatementId === f.id ? "active-cite" : ""}">
        <div class="fact-top">
          <span class="fact-prop">${esc(f.property)}</span>
          ${valHtml}
        </div>
        ${f.scope || f.method ? `<div class="fact-meta">${[f.scope && `scope: ${f.scope}`, f.method && `method: ${f.method}`].filter(Boolean).map(esc).join(" · ")}</div>` : ""}
        ${f.conditions ? `<div class="fact-meta">${esc(f.conditions)}</div>` : ""}
        <div class="pill-row" style="justify-content:space-between;margin-top:2px">
          <span class="pill basis-${esc(f.basis)}">${esc(f.basis)}</span>
          <button class="cite-btn" data-cite="${esc(f.id)}">Cite</button>
        </div>
      </div>`;
  }).join("") : `<div class="empty">No direct property claims on this node.</div>`;

  const relItem = (r, direction) => {
    const otherId = direction === "out" ? r.target : r.subject;
    const other = state.full.byId.get(otherId);
    const qual = formatQualifiers(r.qualifiers);
    return `
      <div class="rel-row ${state.selectedStatementId === r.id ? "active-cite" : ""}">
        <div class="rel-top">
          <span class="rel-pred">${direction === "out" ? "→" : "←"} ${esc(r.predicate)}</span>
          <div style="display:flex;gap:4px;align-items:center">
            <span class="pill basis-${esc(r.basis)}">${esc(r.basis)}</span>
            <button class="cite-btn" data-cite="${esc(r.id)}">Cite</button>
          </div>
        </div>
        <button class="rel-link" data-jump="${esc(otherId)}">${esc(other?.label || otherId)}</button>
        ${qual ? `<div class="rel-qual">${esc(qual)}</div>` : ""}
      </div>`;
  };

  el.innerHTML = `
    <div class="insp-header">
      <div class="pill-row">${metaPills}</div>
      <h2 class="insp-title">${esc(node.label)}</h2>
      <div class="insp-id">${esc(node.id)}</div>
      ${node.description ? `<p class="insp-desc">${esc(node.description)}</p>` : ""}
      <div class="action-row">
        <button class="action-btn" data-root="parts">Walk Parts</button>
        <button class="action-btn" data-root="trace">Trace Chain</button>
        <button class="action-btn" data-root="used-by">Where Used</button>
      </div>
    </div>
    ${citationBlock}
    ${sourceBlock}
    <div>
      <h3 class="section-title"><span>Direct Facts</span><span>${facts.length}</span></h3>
      ${factsHtml}
    </div>
    <div>
      <h3 class="section-title"><span>Outgoing Links</span><span>${outgoing.length}</span></h3>
      ${outgoing.length ? outgoing.map((r) => relItem(r, "out")).join("") : `<div class="empty">None</div>`}
    </div>
    <div>
      <h3 class="section-title"><span>Incoming Links</span><span>${incoming.length}</span></h3>
      ${incoming.length ? incoming.map((r) => relItem(r, "in")).join("") : `<div class="empty">None</div>`}
    </div>
  `;

  el.querySelectorAll("[data-root]").forEach((btn) => {
    btn.onclick = () => setView(btn.dataset.root, node.id);
  });
  el.querySelectorAll("[data-jump]").forEach((btn) => {
    btn.onclick = () => selectNode(btn.dataset.jump);
  });
  el.querySelectorAll("[data-cite]").forEach((btn) => {
    btn.onclick = () => {
      const targetSt = state.full.statements.find((s) => s.id === btn.dataset.cite);
      if (targetSt) inspectStatement(targetSt);
    };
  });
}

function renderCitationBlock() {
  if (!state.selectedStatementId) return "";
  if (!state.citation) return `<div class="evidence-box"><span class="empty">Loading citation…</span></div>`;
  if (state.citation.error) return `<div class="evidence-box"><span class="empty">${esc(state.citation.error)}</span></div>`;

  const st = state.citation.statement;
  return state.citation.evidence.map((ev) => {
    const locRows = Object.entries(ev.locator || {}).map(([k, v]) =>
      `<span class="evidence-k">${esc(k)}</span><span class="evidence-v">${esc(v)}</span>`
    ).join("");
    const src = ev.source;
    return `
      <div class="evidence-box">
        <div class="pill-row" style="justify-content:space-between">
          <span class="pill" style="font-weight:600">Citation · ${esc(st.id)}</span>
          <span class="pill capture-${esc(ev.capture)}">${esc(ev.capture)}</span>
        </div>
        <div style="font-weight:600;font-size:12.5px">${esc(src.label)}</div>
        <div class="evidence-kv">
          <span class="evidence-k">issuer</span><span class="evidence-v">${esc(src.source.issuer || "—")}</span>
          ${src.revision ? `<span class="evidence-k">revision</span><span class="evidence-v">${esc(src.revision)}</span>` : ""}
          ${locRows}
          ${src.source.sha256 ? `<span class="evidence-k">sha256</span><span class="evidence-v" style="font-family:var(--mono)">${esc(src.source.sha256.slice(0, 16))}…</span>` : ""}
        </div>
        <a class="open-source" href="${esc(ev.webHref || ev.href)}" target="_blank" rel="noopener">
          Open ${ev.capture === "saved" ? "archived snapshot" : "source URL"} ↗
        </a>
      </div>`;
  }).join("");
}

function updateToolbarUI() {
  document.querySelectorAll(".mode-tab").forEach((t) => t.classList.toggle("active", t.dataset.mode === state.view.mode));
  const key = state.view.mode === "compare"
    ? `compare:${state.compare.left}|${state.compare.right}`
    : `${state.view.mode}:${state.view.root || ""}`;
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.toggle("active", b.dataset.preset === key));
}

/* ---------- Wire Controls ---------- */

document.querySelectorAll(".preset-btn").forEach((btn) => {
  btn.onclick = () => {
    const idx = btn.dataset.preset.indexOf(":");
    setView(btn.dataset.preset.slice(0, idx), btn.dataset.preset.slice(idx + 1) || null);
  };
});

document.querySelectorAll(".mode-tab").forEach((tab) => {
  tab.onclick = () => setView(tab.dataset.mode, tab.dataset.mode === "compare" ? `${state.compare.left}|${state.compare.right}` : state.selectedNodeId);
});

$("searchInput").addEventListener("input", (e) => {
  state.search = e.target.value;
  renderNodeList();
});

$("toggleSources").addEventListener("change", (e) => {
  state.showSources = e.target.checked;
  computeLayout();
  renderGraph();
  fitToView();
});

$("zoomFit").onclick = fitToView;
$("zoomIn").onclick = () => { state.transform.k = Math.min(2.5, state.transform.k * 1.2); applyTransform(); };
$("zoomOut").onclick = () => { state.transform.k = Math.max(0.25, state.transform.k / 1.2); applyTransform(); };

(async function boot() {
  await loadFullGraph();
  await setView("parts", "window-assembly");
})();
</script>
</body>
</html>
